# TLS and the domain are handled by Coolify's proxy; this only serves files.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    absolute_redirect off;  # keep redirects relative behind the proxy
    charset utf-8;
    charset_types text/plain text/markdown application/json application/xml text/css application/javascript;

    gzip on;
    gzip_types text/plain text/markdown text/css application/javascript application/json application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Agent-facing Markdown (per-project .md pages linked from llms.txt).
    location ~ \.md$ {
        types { }
        default_type text/markdown;
    }

    # Fingerprinted build assets never change.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
